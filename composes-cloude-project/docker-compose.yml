name: composes-cloude-project
services:
  # Nodo academico unico; no publica gossip/JMX ni requiere credenciales existentes.
  cassandra-cloud:
    image: cassandra:5.0.9
    container_name: campuscloud-cassandra
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2.0
    environment:
      CASSANDRA_CLUSTER_NAME: CampusCloudAcademico
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - campuscloud_net
    healthcheck:
      test: [CMD-SHELL, "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local;' > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 90s
  # Base de Datos Postgres
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Base de Datos PgAdmin
  pgadmin-cloud:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  # Base de Datos SQL Server
  sqlserver-cloud:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - campuscloud_net
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -d master -C -b -l 5 -Q "SELECT 1" > /dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Base de datos de grafos Neo4j Community 5
  neo4j-cloud:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Definir NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - campuscloud_net
    healthcheck:
      test:
        - CMD-SHELL
        - 'NEO4J_USERNAME="$${NEO4J_AUTH%%/*}" NEO4J_PASSWORD="$${NEO4J_AUTH#*/}" cypher-shell -a bolt://localhost:7687 "RETURN 1 AS ok" > /dev/null 2>&1'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
  # Base de datos documental MongoDB Community Server
  mongodb-cloud:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: campuscloud-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Definir usuario MongoDB}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Definir password MongoDB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - campuscloud_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost --port 27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'if (db.adminCommand({ping:1}).ok !== 1) quit(1)'
          > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

# VOLUMENES
volumes:
  cassandra-data:
    name: ${CASSANDRA_VOLUME:-campuscloud-cassandra-data}
  neo4j-data:
    name: ${NEO4J_VOLUME}
  mongodb-data:
    name: ${MONGO_VOLUME}
  sqlserver-data:
    name: ${SQLSERVER_VOLUME}

  pgadmin-data:
    name: ${PGADMIN_VOLUME}

  postgres-data:
    name: ${POSTGRES_VOLUME}

# RED
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
